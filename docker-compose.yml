services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: example_company
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/000002_care_journeys.up.sql:/docker-entrypoint-initdb.d/002_care_journeys.sql:ro
      - ./migrations/000003_flexible_programs.up.sql:/docker-entrypoint-initdb.d/003_flexible_programs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d example_company"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/example_company?sslmode=disable
      JWT_SECRET: local-docker-secret-change-before-production
      AUTO_MIGRATE: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      INTEGRATION_WEBHOOK_URL: ${INTEGRATION_WEBHOOK_URL:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
